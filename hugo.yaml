    # title: "Custom Name"
    index: false
    items:
      - title: "Bachelor of Informatics Engineering"
        school:
          name: "Universitas Wijaya Putra Surabaya"
          url: "https://uwp.ac.id/"
        date: "2018 - 2022"
        GPA: "3.73 out of 4.0" # TODO: pastikan IPK ini benar
        # Teks contoh tema (paper ACM, lorem ipsum, link example.com) sudah dihapus.
        # TODO (opsional): tambahkan content, misalnya judul skripsi atau organisasi.
        # content: |-
