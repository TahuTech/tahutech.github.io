    enable: false
    # title: "Custom Name"
    items:
      - title: "TODO: Nama pencapaian"
        content: "TODO: deskripsi singkat"
        # url: https://example.com
        # image: /images/achievement.jpg

  # projects
  # Disusun dari README repo GitHub. Gambar (opsional): simpan di static/images/projects/
  # lalu tambahkan `image: /images/projects/nama-file.png` pada item.
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Mutasi ke Excel
        content: Converts bank e-statements from PDF to Excel (.xlsx) right in the browser, with support for BCA, BNI, BRI and Mandiri. No server, no upload, no sign-up; the PDF never leaves the user's device.
        featured:
          name: Demo
          link: https://mutasi-rekening-excel.netlify.app/
        badges:
          - "JavaScript"
          - "HTML"
          - "CSS"
        links:
          - icon: fab fa-github
            url: https://github.com/TahuTech/mutaxcle

      - title: Rekapin
        content: Sales and receivables system for admins covering customers, installment payments, invoices, payoff receipts, and recaps per customer or period with CSV export. Ships as a single static binary designed for a 1 GB VPS.
        badges:
          - "Go"
          - "HTMX"
          - "Tailwind CSS"
          - "PostgreSQL"
        links:
          - icon: fab fa-github
            url: https://github.com/TahuTech/rekapin-go

      - title: SakuKoperasi
        content: Transaction recording system for a cooperative (koperasi), containerized with Docker for both development and production (Gunicorn and WhiteNoise).
        badges:
          - "Django"
          - "PostgreSQL"
          - "Docker"
        links:
          - icon: fab fa-github
            url: https://github.com/TahuTech/sakukoperasi-django

      - title: LetakIn
        content: Inventory app for workshop shelves that tracks items, bin locations and low stock on a customizable visual shelf grid, so you can find things without unboxing everything.
        badges:
          - "React"
          - "TypeScript"
          - "Express"
          - "Prisma"
        links:
          - icon: fab fa-github
            url: https://github.com/TahuTech/letakin-app

      - title: Stunting Classification
        content: Web app for recording toddler data and classifying stunting with the K-Nearest Neighbors algorithm, with a Vue.js frontend and a Laravel REST API.
        badges:
          - "Vue.js"
          - "Laravel"
          - "KNN"
        links:
          - icon: fab fa-github
            url: https://github.com/TahuTech/stunting-client
          - icon: fas fa-server
            url: https://github.com/TahuTech/stunting-api

