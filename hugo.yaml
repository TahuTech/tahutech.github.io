  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Nur Ali Sholikhin" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hello, my name is"
    title: "Nur Ali Sholikhin."
    subtitle: "I'm a Software Engineer"
    content: "I build practical web applications for everyday business needs, from inventory and sales tracking to cooperative bookkeeping, using Go, Python and TypeScript."
    image: /images/me.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    # TODO: taruh CV di static/resume.pdf, lalu ubah enable menjadi true.
    button:
      enable: false
      name: "Resume"
      url: "/resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/TahuTech
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/nur-ali-sholikhin-78a795247/
      # customIcons:
      #   - icon: /fav.png
      #     url: "https://example.com"

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg" # foto profil GitHub; ganti file ini untuk memakai foto lain
    content: |-
      I am a software engineer based in Surabaya, Indonesia, with a Bachelor's degree in Informatics Engineering from Universitas Wijaya Putra. I like to code, design and experiment, and I learn new tools best by building real things with them.

      Most of my recent work is practical business software: a sales and receivables system in Go and HTMX, a cooperative transaction system in Django, an inventory app that maps every item down to its shelf bin, and a browser-only tool that turns bank statements into Excel files. I care about apps that are simple to run, light on resources and respectful of their users' data.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Go"
        - "Python (Django)"
        - "TypeScript"
        - "React"
        - "Vue.js"
        - "PHP (Laravel)"
        - "PostgreSQL"
        - "Docker"

  # Experience
  # Data contoh tema (Facebook, Amazon, Apple, Netflix, Google) sudah dihapus.
